# Never execute scripts out of the uploads directory, and ignore any
# .htaccess dropped there (the 2026 compromise planted one in every folder).
<Directory /var/www/html/wp-content/uploads>
    AllowOverride None
    <FilesMatch "(?i)\.(php\d?|phtml|phar|pl|py|cgi|sh)$">
        Require all denied
    </FilesMatch>
</Directory>

# xmlrpc.php is unused and a common brute-force target.
<Files xmlrpc.php>
    Require all denied
</Files>

ServerTokens Prod
ServerSignature Off
