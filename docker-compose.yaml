# Troop 506 WordPress — production stack.
#
# TLS and the public hostname are handled by the Caddy reverse proxy in front
# of this host (see _infra/proxy.do.cnshost.net), which forwards to WP_PORT.
# Settings and secrets live in .env (copy .env.example).

services:

  wordpress:
    build:
      context: ./wordpress
      additional_contexts:
        theme: ../troop506-theme
    image: troop506-wordpress:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_BIND:-127.0.0.1}:${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_AUTH_KEY: ${WP_AUTH_KEY:?}
      WORDPRESS_SECURE_AUTH_KEY: ${WP_SECURE_AUTH_KEY:?}
      WORDPRESS_LOGGED_IN_KEY: ${WP_LOGGED_IN_KEY:?}
      WORDPRESS_NONCE_KEY: ${WP_NONCE_KEY:?}
      WORDPRESS_AUTH_SALT: ${WP_AUTH_SALT:?}
      WORDPRESS_SECURE_AUTH_SALT: ${WP_SECURE_AUTH_SALT:?}
      WORDPRESS_LOGGED_IN_SALT: ${WP_LOGGED_IN_SALT:?}
      WORDPRESS_NONCE_SALT: ${WP_NONCE_SALT:?}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${SITE_URL:-https://www.lajollatroop506.com}');
        define('WP_SITEURL', '${SITE_URL:-https://www.lajollatroop506.com}');
        define('DISALLOW_FILE_MODS', true);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('WP_ENVIRONMENT_TYPE', '${WP_ENVIRONMENT_TYPE:-production}');
    # Healthy once the entrypoint has copied core and written wp-config.php.
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/wp-config.php"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./data/uploads:/var/www/html/wp-content/uploads

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db:/var/lib/mysql

volumes:
  db:
